[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "romanmlr"
version = "0.3.0"
description = "Injection-recovery study of Roman Space Telescope GBTDS microlensing completeness and false-positive rate under realistic cadence, blending, finite-source, parallax, and correlated-noise effects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Biswajit Jana" }]
keywords = ["microlensing", "roman-space-telescope", "exoplanets", "astrophysics", "injection-recovery"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
romanmlr = "romanmlr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: computationally heavier tests (ray-shooting binary lens)",
  "network: requires internet access to microlensing-data-challenge GitHub",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py310"
