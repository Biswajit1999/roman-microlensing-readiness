# Default injection-recovery experiment: free-floating-planet (FFP) channel
# under a Penny-et-al.-(2019)-like Roman GBTDS cadence. See docs/METHODS.md
# for the full experimental design and docs/DATA_SOURCES.md for parameter
# provenance.
#
# The grid spans source brightness (mag_ref) as well as impact parameter and
# Einstein-crossing time, because brightness (crowding/blending proxy) is a
# first-order driver of Roman GBTDS microlensing completeness alongside
# event geometry -- a grid that only varies u0/tE at one fixed, bright
# magnitude does not probe the actual detection boundary (see
# docs/CLAIMS.md item 9 and the run history in results/default/).
channel: ffp

cadence:
  n_seasons: 6
  season_length_days: 72
  season_gap_days: 61
  cadence_minutes: 15
  downlink_gap_every_hours: 12
  downlink_gap_minutes: 40
  random_dropout_frac: 0.02
  t0_days: 0

fixed:
  t0: 30.0
  fs: 1.0
  fb: 0.0
  rho: 0.005
  detection_threshold: 500.0
  anomaly_threshold: 160.0

grid:
  mag_ref: [19.0, 22.0, 24.0, 25.5]
  u0: [0.02, 0.1, 0.3, 0.6, 1.0, 1.5, 2.5]
  tE: [0.02, 0.08, 0.3, 1.0]

n_seeds_per_point: 5
